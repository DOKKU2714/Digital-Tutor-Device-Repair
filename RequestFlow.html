<style>
  .smart-device-check { display:flex; flex-direction:row; align-items:center; gap:10px; margin:2px 0 18px; padding:14px 16px; border:1px solid #d8e5e4; border-radius:12px; color:#33464d; background:#fbfefd; font-size:14px; font-weight:800; cursor:pointer; }
  .smart-device-check input { width:19px; min-height:19px; margin:0; accent-color:var(--teal); }
  .smart-device-check:hover { border-color:#a9c9c4; background:#f7fcfb; }
  .device-lock-field { margin-top:12px; }
  #request-form .wizard-card > .field:has(.lock-options) { margin-top:12px; }
  .field.validation-error input,.field.validation-error textarea,.field.validation-error select { border-color:#dc2626; background:#fff7f7; box-shadow:0 0 0 3px #dc26261a; }
  .field.validation-error > span:first-child { color:#b91c1c; }
  .validation-message { display:block; margin:0; color:#dc2626; font-size:12px; line-height:1.45; font-weight:700; }
</style>
<script>
  const VALIDATION_RULES = {
    name: /^[가-힣A-Za-z][가-힣A-Za-z .'-]{1,19}$/,
    phone: /^0\d{1,2}-?\d{3,4}-?\d{4}$/,
    gmail: /^[A-Za-z0-9](?:[A-Za-z0-9.]{0,28})@gmail\.com$/i,
    studentNumber: /^\d{4,10}$/
  };
  let validationAttempted = false;

  function setFieldValidity(input, isValid, message) {
    if (!input) return;
    const value = input.value.trim();
    const hasValue = value.length > 0;
    const formatValid = !hasValue || isValid;
    input.setCustomValidity(formatValid ? '' : message);
    const field = input.closest('.field');
    if (!field) return;
    let warning = field.querySelector('.validation-message');
    if (!warning) {
      warning = document.createElement('small');
      warning.className = 'validation-message hidden';
      field.appendChild(warning);
    }
    const showError = hasValue && !isValid && (validationAttempted || input.dataset.validationTouched === 'true');
    field.classList.toggle('validation-error', showError);
    warning.classList.toggle('hidden', !showError);
    warning.textContent = showError ? message : '';
  }

  function clearValidationState(form) {
    if (!form) return;
    form.querySelectorAll('.validation-error').forEach(field => field.classList.remove('validation-error'));
    form.querySelectorAll('.validation-message').forEach(message => { message.classList.add('hidden'); message.textContent = ''; });
    form.querySelectorAll('input, textarea, select').forEach(input => delete input.dataset.validationTouched);
  }

  function validateRequestInputs() {
    const form = $('#request-form');
    if (!form) return;

    const validateName = input => {
      if (!input || input.closest('.hidden')) return;
      setFieldValidity(input, VALIDATION_RULES.name.test(input.value.trim()), '이름은 한글 또는 영문으로 2~20자 입력해 주세요.');
    };
    const validatePhone = input => {
      if (!input || input.closest('.hidden')) return;
      setFieldValidity(input, VALIDATION_RULES.phone.test(input.value.replace(/\s/g, '').trim()), '올바른 전화번호를 입력해 주세요. 예: 010-1234-5678');
    };
    const validateStudentNumber = input => {
      if (!input || input.closest('.hidden')) return;
      setFieldValidity(input, VALIDATION_RULES.studentNumber.test(input.value.trim()), '학번은 숫자 4~10자리로 입력해 주세요.');
    };
    const validateGmail = input => {
      if (!input || input.closest('.hidden')) return;
      setFieldValidity(input, VALIDATION_RULES.gmail.test(input.value.trim()), '구글 아이디는 @gmail.com 형식으로 입력해 주세요.');
    };

    validateName(form.teacherName);
    validateName(form.studentName);
    validatePhone(form.teacherPhone);
    validateStudentNumber(form.studentNumber);

    if ($('#student-device-fields') && !$('#student-device-fields').classList.contains('hidden')) {
      validateGmail(form.studentGoogleId);
      if (form.studentGooglePassword) {
        setFieldValidity(form.studentGooglePassword, form.studentGooglePassword.value.trim().length >= 4 && form.studentGooglePassword.value.length <= 128, '구글 비밀번호는 4~128자로 입력해 주세요.');
      }
    }

    if (form.deviceModel) {
      const value = form.deviceModel.value.trim();
      setFieldValidity(form.deviceModel, value.length >= 2 && value.length <= 100, '기기명은 2~100자로 입력해 주세요.');
    }
    if (form.deviceNumber) {
      const value = form.deviceNumber.value.trim();
      setFieldValidity(form.deviceNumber, value.length >= 3 && value.length <= 100, '제조번호는 3~100자로 입력해 주세요.');
    }
    if (form.devicePassword && !form.devicePassword.closest('.hidden')) {
      const value = form.devicePassword.value;
      setFieldValidity(form.devicePassword, value.length >= 4 && value.length <= 128, '기기 비밀번호는 4~128자로 입력해 주세요.');
    }
    if (form.symptoms) {
      const value = form.symptoms.value.trim();
      setFieldValidity(form.symptoms, value.length >= 5 && value.length <= 2000, '증상은 5~2000자로 입력해 주세요.');
    }
    if (form.referenceNotes) {
      setFieldValidity(form.referenceNotes, form.referenceNotes.value.length <= 1000, '참고사항은 1000자 이내로 입력해 주세요.');
    }
  }

  function resetRequestWizard() {
    const form = $('#request-form');
    if (!form) return;
    form.reset();
    validationAttempted = false;
    clearValidationState(form);
    currentRequestStep = 1;
    $('#pattern-file-name').textContent = '';
    $('#additional-file-name').textContent = '';
    updateApplicantFields();
    updateSmartDeviceFields();
    updateLockFields();
    renameDeviceLockLabel();
    validateRequestInputs();
    showRequestStep(1, 0);
  }

  function renameDeviceLockLabel() {
    const field = $('#device-password-field');
    if (field) {
      const label = field.querySelector('span:first-child');
      const input = field.querySelector('input[name="devicePassword"]');
      if (label) label.innerHTML = '기기 비밀번호 <i>*</i>';
      if (input) input.placeholder = '기기 비밀번호';
    }
    const lockGroup = $('#request-form .lock-options');
    const lockField = lockGroup ? lockGroup.closest('.field') : null;
    if (lockField) {
      lockField.classList.add('device-lock-field');
      const label = lockField.firstElementChild;
      if (label) label.innerHTML = '기기 잠금 <i>*</i>';
    }
  }

  function showRequestStep(step, direction) {
    currentRequestStep = Math.min(3, Math.max(1, step));
    document.querySelectorAll('#request-form .wizard-step').forEach(panel => {
      const isActive = Number(panel.dataset.step) === currentRequestStep;
      panel.classList.toggle('active', isActive);
      if (isActive) panel.dataset.direction = direction < 0 ? 'back' : 'forward';
    });
    document.querySelectorAll('#request-form .progress-item').forEach(item => {
      const itemStep = Number(item.dataset.progress);
      item.classList.toggle('active', itemStep === currentRequestStep);
      item.classList.toggle('done', itemStep < currentRequestStep);
    });
    document.querySelectorAll('#request-form .progress-line').forEach((line, index) => line.classList.toggle('done', index < currentRequestStep - 1));
    validateRequestInputs();
    updateWizardNavigation();
    renameDeviceLockLabel();
    const title = $('#request-form .wizard-step.active h2');
    if (title) window.setTimeout(() => {
      if (!$('#request-screen').classList.contains('active')) return;
      title.setAttribute('tabindex', '-1');
      title.focus();
    }, 120);
  }

  function advanceRequestStep(direction) {
    if (direction > 0) validationAttempted = true;
    validateRequestInputs();
    if (direction > 0 && !isStepComplete(currentRequestStep)) {
      reportCurrentStepValidity();
      return;
    }
    showRequestStep(currentRequestStep + direction, direction);
  }

  function updateApplicantFields() {
    const selected = document.querySelector('input[name="applicantType"]:checked');
    const type = selected ? selected.value : '';
    const teacherFields = $('#teacher-fields');
    const studentFields = $('#student-fields');
    teacherFields.classList.toggle('hidden', type !== 'teacher');
    studentFields.classList.toggle('hidden', type !== 'student');
    teacherFields.querySelectorAll('input').forEach(input => { input.required = type === 'teacher'; });
    studentFields.querySelectorAll('input').forEach(input => { input.required = type === 'student'; });
  }

  function updateSmartDeviceFields() {
    const checkbox = $('#student-smart-device');
    const fields = $('#student-device-fields');
    const privacy = $('#privacy-note');
    const enabled = Boolean(checkbox && checkbox.checked);
    fields.classList.toggle('hidden', !enabled);
    privacy.classList.toggle('hidden', !enabled);
    fields.querySelectorAll('input').forEach(input => { input.required = enabled; });
  }

  function updateLockFields() {
    const selected = document.querySelector('input[name="lockType"]:checked');
    const lockType = selected ? selected.value : '';
    $('#pattern-image-field').classList.toggle('hidden', lockType !== 'pattern');
    $('#device-password-field').classList.toggle('hidden', lockType !== 'password');
    $('#pattern-image').required = lockType === 'pattern';
    $('#request-form').devicePassword.required = lockType === 'password';
    renameDeviceLockLabel();
  }

  function isStepComplete(step) {
    validateRequestInputs();
    const form = $('#request-form');
    if (step === 1) {
      if (!form.querySelector('input[name="applicantType"]:checked')) return false;
      const panel = form.querySelector('.wizard-step[data-step="1"]');
      return Array.from(panel.querySelectorAll('[required]')).filter(field => !field.closest('.hidden')).every(field => field.checkValidity());
    }
    const panel = form.querySelector('.wizard-step[data-step="' + step + '"]');
    if (!panel) return false;
    if (step === 2 && !form.querySelector('input[name="lockType"]:checked')) return false;
    const requiredFields = Array.from(panel.querySelectorAll('[required]')).filter(field => !field.closest('.hidden'));
    return requiredFields.every(field => field.checkValidity());
  }

  function reportCurrentStepValidity() {
    validationAttempted = true;
    validateRequestInputs();
    const panel = $('#request-form .wizard-step.active');
    const firstInvalid = Array.from(panel.querySelectorAll('[required]')).find(field => !field.closest('.hidden') && !field.checkValidity());
    if (firstInvalid) {
      firstInvalid.reportValidity();
      return;
    }
    if (currentRequestStep === 1) showToast('신청자 유형과 정보를 올바르게 입력해 주세요.', true);
    else if (currentRequestStep === 2) showToast('기기 정보와 기기 잠금 정보를 올바르게 입력해 주세요.', true);
  }

  function updateWizardNavigation() {
    const panel = $('#request-form .wizard-step.active');
    if (!panel) return;
    updateSmartDeviceFields();
    validateRequestInputs();
    const complete = isStepComplete(currentRequestStep);
    const next = panel.querySelector('.wizard-next');
    const hint = panel.querySelector('.wizard-hint');
    if (next) next.classList.toggle('hidden', !complete);
    if (hint) hint.textContent = complete ? '입력이 완료되었어요.' : (currentRequestStep === 1 ? '신청자 정보를 입력해 주세요.' : currentRequestStep === 2 ? '필수 항목을 올바르게 입력해 주세요.' : '증상을 입력해 주세요.');
  }

  async function submitForm(event) {
    event.preventDefault();
    const form = event.target;
    validationAttempted = true;
    validateRequestInputs();
    if (!isStepComplete(3) || !form.reportValidity()) {
      reportCurrentStepValidity();
      return;
    }
    const button = $('#submit-button');
    button.disabled = true;
    button.innerHTML = '사진을 준비하고 접수 중입니다…';
    showLoading('수리 요청을 접수하는 중입니다…');
    try {
      const type = form.querySelector('input[name="applicantType"]:checked').value;
      const lockType = form.querySelector('input[name="lockType"]:checked').value;
      const isStudentSmartDevice = $('#student-smart-device').checked;
      const payload = {
        applicantType:type,
        teacherName:form.teacherName.value,
        teacherPhone:form.teacherPhone.value,
        studentNumber:form.studentNumber.value,
        studentName:form.studentName.value,
        studentGoogleId:isStudentSmartDevice ? form.studentGoogleId.value : '',
        studentGooglePassword:isStudentSmartDevice ? form.studentGooglePassword.value : '',
        isStudentSmartDevice,
        deviceModel:form.deviceModel.value,
        deviceNumber:form.deviceNumber.value,
        lockType,
        devicePassword:form.devicePassword.value,
        symptoms:form.symptoms.value,
        referenceNotes:form.referenceNotes.value,
        patternImage:lockType === 'pattern' ? await fileToDataUrl($('#pattern-image').files[0]) : '',
        additionalImages:await filesToDataUrls($('#additional-images').files)
      };
      validateImageSize(payload.patternImage, '패턴 사진');
      payload.additionalImages.forEach(data => validateImageSize(data, '추가 사진'));
      google.script.run.withSuccessHandler(result => {
        hideLoading();
        $('#completed-request-id').textContent = result.requestId;
        resetRequestWizard();
        button.disabled = false;
        button.innerHTML = '수리 요청 접수하기 <span>→</span>';
        switchTab('complete');
      }).withFailureHandler(error => { hideLoading(); throwServerError(error); resetSubmitButton(button); }).submitRepairRequest(payload);
    } catch (error) {
      hideLoading();
      showToast(error.message || '입력 내용을 확인해 주세요.', true);
      resetSubmitButton(button);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const form = $('#request-form');
    if (!form) return;
    const inputs = form.querySelectorAll('input, textarea, select');
    inputs.forEach(input => ['input', 'change', 'blur'].forEach(eventName => input.addEventListener(eventName, () => {
      input.dataset.validationTouched = 'true';
      validateRequestInputs();
      if (currentRequestStep) updateWizardNavigation();
    })));
    const smartDevice = $('#student-smart-device');
    if (smartDevice) smartDevice.addEventListener('change', () => {
      smartDevice.dataset.validationTouched = 'true';
      updateSmartDeviceFields();
      validateRequestInputs();
      updateWizardNavigation();
    });
    renameDeviceLockLabel();
    validateRequestInputs();
    updateSmartDeviceFields();
    updateLockFields();
  });
</script>
