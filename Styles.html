<style>
  :root { --ink:#17212b; --muted:#596975; --line:#d9e5e4; --soft:#f3f8f7; --teal:#0f766e; --teal-dark:#115e59; --teal-pale:#e8f6f3; --orange:#f59e0b; --danger:#b42318; }
  * { box-sizing:border-box; }
  html { background:#eff7f5; }
  body { min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(circle at 8% 5%,#d8f1eb 0,transparent 28rem),radial-gradient(circle at 93% 80%,#dcefea 0,transparent 25rem),#eff7f5; font-family:"Noto Sans KR",Pretendard,Arial,sans-serif; font-size:16px; line-height:1.6; }
  button,input,textarea,select { font:inherit; }
  button { cursor:pointer; }
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid #0f766e55; outline-offset:3px; }
  h1,h2,p { margin-top:0; }

  .home-screen { position:relative; }

  .home-admin-button:hover { transform:translateY(-2px); background:white; box-shadow:0 12px 26px #175a5428; }
  .home-hero { position:relative; overflow:hidden; min-height:590px; border-radius:30px; padding:66px 58px 48px; color:white; background:linear-gradient(140deg,#0b5953,#0f766e 55%,#239085); box-shadow:0 24px 55px #0e6d6438; }
  .home-hero::before,.home-hero::after { position:absolute; border-radius:50%; content:""; pointer-events:none; }

  .home-copy { position:relative; z-index:1; margin:0; color:#d8f4ee; font-size:16px; line-height:1.7; }
  .home-choice-grid { position:relative; z-index:1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:48px; }
  .home-choice { position:relative; display:flex; min-height:185px; overflow:hidden; flex-direction:column; align-items:flex-start; border:1px solid #ffffff3b; border-radius:20px; padding:22px; text-align:left; transition:transform .24s cubic-bezier(.2,.8,.2,1),background .24s,box-shadow .24s; }
  .home-choice:hover { transform:translateY(-6px); box-shadow:0 16px 28px #073f3a35; }

  .step-kicker { color:var(--teal); }
  .wizard-card h2,.completion-card h2 { margin-bottom:8px; color:#1e353b; font-size:clamp(25px,4vw,32px); line-height:1.35; letter-spacing:-1.35px; }
  .step-copy { margin-bottom:32px; color:var(--muted); font-size:15px; }
  .type-choice-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .type-choice { position:relative; display:flex; min-height:215px; flex-direction:column; align-items:flex-start; border:1px solid #d8e5e4; border-radius:18px; padding:26px; background:#fcfefe; cursor:pointer; transition:transform .22s,border-color .22s,background .22s,box-shadow .22s; }

  .type-icon { display:grid; width:47px; height:47px; margin-bottom:20px; border-radius:15px; place-items:center; color:var(--teal); background:#dff3ee; font-size:27px; }

  .completion-screen { min-height:calc(100vh - 64px); align-items:center; }

  .completion-card { width:100%; border:1px solid var(--line); border-radius:28px; padding:56px 44px; background:white; box-shadow:0 18px 38px #153d3b16; text-align:center; }

  .request-result-top { display:flex; justify-content:space-between; gap:12px; align-items:start; margin-bottom:13px; }

  .result-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 20px; font-size:13px; }

  .card { padding:26px; margin:0 0 16px; }
  .admin-toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .admin-toolbar strong { display:block; font-size:17px; }
  .admin-toolbar small { display:block; color:var(--muted); font-size:12px; }
  .toolbar-actions { display:flex; align-items:center; gap:12px; }
  .small-button { min-height:auto; padding:9px 13px; font-size:12px; }
  .admin-stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .stat-card { border:1px solid var(--line); border-radius:13px; background:white; padding:15px; }
  .stat-card small { display:block; color:var(--muted); font-size:11px; }
  .stat-card strong { display:block; margin-top:4px; color:var(--teal-dark); font-size:24px; }
  .admin-filter { display:grid; grid-template-columns:160px 1fr auto; gap:12px; align-items:end; }

  .filter-button { padding:12px 20px; }
  .admin-detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 22px; margin:13px 0; font-size:13px; }

  .sensitive-details { margin:12px 0; border:1px solid #f5d98b; border-radius:10px; background:#fffaf0; padding:10px 13px; }

  .sensitive-details .admin-detail-grid { margin-bottom:0; }
  .admin-status-editor { display:grid; grid-template-columns:180px 1fr auto; gap:12px; align-items:end; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }

  .admin-list { display:flex; flex-direction:column; gap:10px; }

  .admin-request-item[open] .admin-expand-icon { transform:rotate(45deg); }
  .admin-request-body { border-top:1px solid #edf2f2; padding:4px 20px 20px; }
  .admin-pagination { display:flex; justify-content:center; align-items:center; gap:5px; margin:20px 0 32px; }

  .admin-page-button:hover { border-color:var(--teal); color:var(--teal-dark); }
  .admin-page-button.active { border-color:var(--teal); background:var(--teal); color:white; }
  .admin-page-button:disabled { cursor:not-allowed; opacity:.35; }

  .pagination-gap { color:var(--muted); padding:0 3px; }
  .pagination-label { color:var(--muted); margin-left:8px; font-size:11px; }

  .modal-backdrop,.loading-backdrop { position:fixed; inset:0; display:grid; place-items:center; padding:20px; z-index:10; }

  .modal-close { position:absolute; top:13px; right:15px; border:0; background:transparent; color:var(--muted); font-size:26px; line-height:1; }
  .modal-eyebrow { color:var(--teal); opacity:1; }
  .modal-card h2 { margin:0 0 5px; font-size:24px; }
  .modal-copy { color:var(--muted); font-size:13px; margin-bottom:23px; }
  .modal-submit { width:100%; margin-top:6px; }

  .loading-card { display:flex; flex-direction:column; align-items:center; gap:8px; min-width:210px; border-radius:16px; background:white; padding:25px 28px; box-shadow:0 20px 60px #06151c55; text-align:center; }
  .loading-card strong { font-size:14px; }.loading-card small { color:var(--muted); font-size:11px; }
  .loading-spinner { width:32px; height:32px; border:3px solid #d7ebe8; border-top-color:var(--teal); border-radius:50%; animation:loading-spin .8s linear infinite; }
  .toast { position:fixed; left:50%; bottom:24px; z-index:30; max-width:calc(100% - 32px); border-radius:11px; padding:13px 18px; color:white; background:#17212b; font-size:13px; transform:translate(-50%,20px); opacity:0; pointer-events:none; transition:.22s; }.toast.show { transform:translate(-50%,0); opacity:1; }.toast.error { background:var(--danger); }

  @keyframes screen-enter { from { opacity:0; transform:translateY(16px) scale(.99); } to { opacity:1; transform:none; } }
  @keyframes step-enter { from { opacity:0; transform:translateX(22px); } to { opacity:1; transform:none; } }
  @keyframes step-enter-back { from { opacity:0; transform:translateX(-22px); } to { opacity:1; transform:none; } }
  @keyframes next-appear { from { opacity:0; transform:translateY(6px) scale(.96); } to { opacity:1; transform:none; } }
  @keyframes brand-pop { from { opacity:0; transform:scale(.7) rotate(-10deg); } to { opacity:1; transform:none; } }
  @keyframes check-pop { from { opacity:0; transform:scale(.4) rotate(-25deg); } to { opacity:1; transform:none; } }
  @keyframes float-orb { 50% { transform:translate(-12px,16px) scale(1.07); } }
  @keyframes modal-pop { from { opacity:0; transform:scale(.94) translateY(9px); } to { opacity:1; transform:none; } }
  @keyframes loading-spin { to { transform:rotate(360deg); } }
